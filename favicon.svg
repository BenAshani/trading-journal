<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#181512"/>
  <!-- Trend line -->
  <polyline points="4,26 10,20 17,14 28,6" stroke="#C28B4A" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- Candle 1 — bearish (left) -->
  <line x1="9" y1="17" x2="9" y2="20" stroke="#F87171" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="6.5" y="20" width="5" height="6" rx="1" fill="#F87171"/>
  <line x1="9" y1="26" x2="9" y2="28" stroke="#F87171" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Candle 2 — bullish (middle) -->
  <line x1="16" y1="10" x2="16" y2="13" stroke="#C28B4A" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="13.5" y="13" width="5" height="8" rx="1" fill="#C28B4A"/>
  <line x1="16" y1="21" x2="16" y2="24" stroke="#C28B4A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Candle 3 — bullish tall (right) -->
  <line x1="23" y1="5" x2="23" y2="8" stroke="#DDBA84" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="20.5" y="8" width="5" height="11" rx="1" fill="#DDBA84"/>
  <line x1="23" y1="19" x2="23" y2="22" stroke="#DDBA84" stroke-width="1.2" stroke-linecap="round"/>
</svg>
